# RosettaStone config for Schmidtea mediterranea. See ../../rosettastone.conf.example for what
# each key means, and check what it resolves to with:
#   ./run_pipeline.sh -c examples/schmidtea_mediterranea/rosettastone.conf --plan
#
# References: both haplotypes of schMedS3 (S2F19, WormBase ParaSite WBPS19). Mapped onto them:
# every active gene set in the datastore (smed_20140614, ddv6, schMedA2h1/h2, and the two
# references themselves, which links h1 and h2 genes), plus the RosettaStone v2 sets that are
# not in the datastore (PlanMine assemblies, ESTs, NCBI, microarray probes).

V2=/n/sci/SCI-003983-SBSMED/RosettaStone/RosettaStone_v2
EXAMPLE_DIR=$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)

SPECIES_DIR=/n/sci/SCI-004223-SBGENOMES/genomes/v2/Schmidtea_mediterranea
REFERENCE_GENESETS="schMedS3h1/schMedS3h1_WBPS19 schMedS3h2/schMedS3h2_WBPS19"
# The hub names MOOP's crosswalk config used for these until now. Drop this line if MOOP
# should use the gene set names instead.
REFERENCE_HUBS="schMedS3h1_WBPS19=S2F19H1_WBPS19_genes schMedS3h2_WBPS19=S2F19H2_WBPS19_genes"
MAP_GENESETS=active
EXCLUDE_GENESETS=""

# v2 query sets. smed_20140614 and the S2F19 transcripts now come from the datastore.
QUERY_DIR=$V2/querydb
QUERY_EXCLUDE="smed_20140614 S2F19H1_WBPS19 S2F19H2_WBPS19"
PROBE_DIR=$V2/microarray_db
UNSTRANDED_SETS="smed_20140614 smed_ncbi_20240424"

ALIAS_RULES=$EXAMPLE_DIR/alias_rules.sh
SMU_TO_DD4=$V2/additional_files/SMU_to_dd4.txt
NCBIPROT_TO_NCBINUCL=$V2/additional_files/ncbiprot_to_ncbinucl.txt
ALIAS_TABLES="$V2/aliases/published_alias.txt"
ALIAS_SOURCE_RENAME="ncbi=smed_ncbi_20240424"

OUT_DIR=/n/sci/SCI-003983-SBSMED/RosettaStone/RosettaStone_v3

CROSSWALK_ORGANISM=Schmidtea_mediterranea
TRANSFER_HUBS="smed_20140614"
# Legacy: PAGE-annotated IDs the genome mapping misses, from the 2020 BLAT mapping to smed_20140614
CROSSWALK_FALLBACK_IDS=$V2/smr_reformat_for_blaze_load/ids_in_page_annotations
CROSSWALK_FALLBACK_MAPPING=$V2/smr_reformat_for_blaze_load/smed_20140614_transcriptome_mapping.txt
CROSSWALK_FALLBACK_HUB=smed_20140614
CROSSWALK_FALLBACK_SET_RENAME="smed_ncbi_20200123=smed_ncbi_20240424"

THREADS=16
MODULES="minimap2/2.26 gffread/0.12.7 agat/1.2.0 pblat/2.5.1 bedops/2.4.40 bedtools/2.30.0"
