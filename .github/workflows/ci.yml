name: CI

# Buys upgrade confidence: every push/PR gets a full php -l syntax sweep and the
# assert-based smoke tests over the critical paths (access control, search-query
# building, cache invalidation). No site data or secrets required — the tests are
# hermetic (mocked $_SESSION + temp files).
#
# The JavaScript half mirrors it exactly: node --check over every non-vendor .js, then
# tests/js_smoke_tests.js. That side exists because MOOP's search behaviour — which input
# is usable, and what gets highlighted in a results row — lives in JS, is pure, and has
# been wrong before in ways no PHP test could see.

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: php + js lint and smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'   # match the production runtime
          coverage: none

      - name: Lint every PHP file (php -l)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null 2>&1; then
              echo "::error file=$file::PHP syntax error"
              php -l "$file" || true
              status=1
            fi
          done < <(find . -path ./vendor -prune -o -name '*.php' -print0)
          if [ "$status" -eq 0 ]; then echo "All PHP files pass php -l"; fi
          exit $status

      - name: Run smoke tests
        env:
          VALIDATE_CONFIG: 'false'   # skip config-completeness validation (no site data in CI)
        run: php tests/smoke_tests.php

      # Ranking is asserted separately because it needs a real (throwaway) database, which
      # the smoke tests deliberately avoid. It builds its own fixture in the temp dir, so it
      # is still hermetic. Counting string matches cannot catch a ranking bug -- every metric
      # we had scored the "nexin" failure 100/100 -- so these assert ORDERINGS instead.
      - name: Run search ranking tests
        env:
          VALIDATE_CONFIG: 'false'
        run: php tests/search_ranking_tests.php

      # js/vendor is excluded for the same reason ./vendor is above: third-party bundles
      # are not ours to fix, and a minified file's syntax is upstream's problem.
      - name: Lint every JS file (node --check)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file" >/dev/null 2>&1; then
              echo "::error file=$file::JavaScript syntax error"
              node --check "$file" || true
              status=1
            fi
          done < <(find js -path 'js/vendor' -prune -o -name '*.js' -print0)
          if [ "$status" -eq 0 ]; then echo "All non-vendor JS files pass node --check"; fi
          exit $status

      - name: Run JS smoke tests
        run: node tests/js_smoke_tests.js

  # Will MOOP still work on a newer PHP? Production runs RHEL's PHP 8.0, which upstream no
  # longer supports (fixes come only as Red Hat backports); RHEL 9 offers 8.1-8.3. Three checks,
  # all maintained by others -- nothing here is a hand-kept list of deprecated functions:
  #   - php -l under 8.3: syntax the newer parser rejects.
  #   - the PHP tests under 8.3, then any deprecation they triggered: includes/deprecation_log.php
  #     records each one in logs/deprecations/ (it does so on the live site too), so a non-empty
  #     directory fails the job and prints what was hit.
  #   - PHPCompatibility, a static scan of every file for 8.0-8.3 (phpcompat.xml), including code
  #     no test reaches. Installed in a temp directory: a CI tool, never shipped.
  php-next:
    name: PHP 8.3 readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint every PHP file under 8.3
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null 2>&1; then
              echo "::error file=$file::Does not parse on PHP 8.3"
              php -l "$file" || true
              status=1
            fi
          done < <(find . -path ./vendor -prune -o -name '*.php' -print0)
          exit $status

      - name: PHP tests under 8.3
        env:
          VALIDATE_CONFIG: 'false'
        run: |
          php tests/smoke_tests.php
          php tests/search_ranking_tests.php

      - name: No deprecations triggered by the tests
        run: |
          shopt -s nullglob
          found=(logs/deprecations/*.json)
          if [ ${#found[@]} -gt 0 ]; then
            for f in "${found[@]}"; do
              php -r '$d = json_decode(file_get_contents($argv[1]), true); echo "::error file={$d["file"]},line={$d["line"]}::{$d["message"]}\n";' "$f"
            done
            exit 1
          fi
          echo "No deprecations"

      - name: PHPCompatibility scan (PHP 8.0-8.3)
        run: |
          mkdir -p /tmp/phpcompat && cd /tmp/phpcompat
          echo '{}' > composer.json
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --no-interaction --quiet "phpcompatibility/php-compatibility:^10.0@alpha" dealerdirect/phpcodesniffer-composer-installer
          cd "$GITHUB_WORKSPACE"
          git ls-files '*.php' | grep -v '^vendor/' > /tmp/phpcompat/files.txt
          php -d memory_limit=1G /tmp/phpcompat/vendor/bin/phpcs -n --standard=phpcompat.xml --file-list=/tmp/phpcompat/files.txt

  # The build pipeline (config/build_and_load_db) is Perl. Four steps, each for a failure that
  # otherwise shows up only as wrong data on the site:
  #   - perl -c: a syntax or missing-module error (every pipeline script and module).
  #   - check_perl_file_scope.pl: the "file-scope assignment" trap -- a table assigned below
  #     the code that uses it is still EMPTY when read, with no error and no warning. It
  #     silently broke gene naming three times on 2026-09-25.
  #   - naming_end_to_end.pl: gene naming on a tiny made-up gene set, one gene per naming rule,
  #     asserting the exact names and provenance. Hermetic; it caught both silent bugs when run
  #     against the broken versions.
  #   - draft_expression_metadata_test.pl: expression samples named from the reads STAR aligned,
  #     not from a list's order (22 of 24 Nvec samples in two projects were mislabelled that way).
  pipeline:
    name: pipeline perl checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Perl modules the pipeline loads
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbi-perl libdbd-sqlite3-perl liburi-perl

      - name: Compile every pipeline Perl file (perl -c)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! perl -Iconfig/build_and_load_db/analysis_parsers -c "$file" >/dev/null 2>&1; then
              echo "::error file=$file::Perl does not compile"
              perl -Iconfig/build_and_load_db/analysis_parsers -c "$file" || true
              status=1
            fi
          done < <(find config/build_and_load_db \( -path '*/old' -o -path '*/data' -o -path '*/slurm_logs' \) -prune \
                   -o \( -name '*.pl' -o -name '*.pm' \) -print0)
          if [ "$status" -eq 0 ]; then echo "All pipeline Perl files compile"; fi
          exit $status

      - name: No file-scope assignment after work
        run: perl config/build_and_load_db/tests/check_perl_file_scope.pl

      - name: Gene naming end to end
        run: perl config/build_and_load_db/tests/naming_end_to_end.pl

      - name: Expression metadata drafter
        run: perl config/build_and_load_db/tests/draft_expression_metadata_test.pl
