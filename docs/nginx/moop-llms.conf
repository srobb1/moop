# The agent guide: <prefix>/llms.txt is generated by llms.php (from config, so its links follow the
# site). Exact-match locations win over every regex, so this file's name order in default.d does not
# matter. llm.txt (a common misspelling) redirects to it.
#
# Install (root):  cp docs/nginx/moop-llms.conf /etc/nginx/default.d/ && nginx -t && systemctl reload nginx
# For a site served at its domain's root (link_prefix "/"), drop "/moop" from the three paths.
location = /moop/llms.txt { rewrite ^ /moop/llms.php last; }
location = /moop/llm.txt  { return 301 /moop/llms.txt; }
