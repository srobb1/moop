# MOOP rate limits — SERVER context. Installed to /etc/nginx/default.d/moop-ratelimit.conf by
# scripts/install_nginx_limits.sh, which also writes the http-context half (zones, the request
# classes and the exempt address ranges) to /etc/nginx/conf.d/moop-ratelimit.conf.
#
# Why: crawlers and AI scrapers request every URL they can find; each gene page is several
# SQLite queries and each export far more. These limits cap what ONE address can take; the
# Turnstile check (lib/human_check.php) handles crawlers that spread over many addresses.
# Plan: notes/BOT_PROTECTION_PLAN.md.
#
# Only PHP is limited — static files (css/js/images) are cheap and a page pulls ~30 of them.
# Internal/VPN and institute addresses (auto_login_ip_ranges) are never limited. A key that is
# "" is not counted at all, which is how both exemptions work (see the maps in the http half).
#
# Limits per address (rate = sustained; burst = how many may arrive at once, served without
# delay — "nodelay" — so a human's quick clicks never wait):
#   page     gene/organism/search pages ....... 2/s,   burst 30
#   api      AJAX (search fan-out is 5 at a time over up to 85 organisms) .. 10/s, burst 150
#   jbrowse  genome browser config + sequence ranges (many per scroll) .... 30/s, burst 300
#   heavy    exports, downloads, sequence/BLAST runs ... 20/min, burst 10, 3 at once
#   any PHP  at most 20 requests in flight from one address (php-fpm has 50 workers)
#
# Inherited by every location in the server, including php.conf's, because none of them sets
# its own limit_req/limit_conn. ⚠️ A location that ever does will DROP all of these for itself.

limit_req  zone=moop_page    burst=30  nodelay;
limit_req  zone=moop_api     burst=150 nodelay;
limit_req  zone=moop_jbrowse burst=300 nodelay;
limit_req  zone=moop_heavy   burst=10  nodelay;
limit_conn moop_conn        20;
limit_conn moop_heavy_conn  3;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  warn;
limit_conn_log_level warn;

# robots.txt lives in the repo (moop/robots.txt) but crawlers only ever ask for /robots.txt.
location = /robots.txt {
    alias /var/www/html/moop/robots.txt;
    default_type text/plain;
}
