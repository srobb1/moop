# smedgd.stowers.org -- the old SmedGD (Schmidtea mediterranea Genome Database) name. DNS makes it an
# alias of planosphere.stowers.org, so its visitors arrive on this machine; without this file nginx's
# default block answered them with the Red Hat test page (found 2026-11-19).
#
# SmedGD's own pages no longer exist, so every address goes to Planosphere's SmedGD page, which says
# where its data and tools went -- EXCEPT old ontology term pages (/ontology/PLANA_0002016), which go
# to that term's page on Planosphere (seen in the System Monitor's outside-404 report, 2026-11-23).
# The term id is the only part of the request copied into the redirect, and only [A-Z]{2,10}_[0-9]{4,8}.
#
# 302 (temporary), not 301: browsers cache a 301 forever, and the targets may change -- switch to
# 301 once settled.
#
# Install (root): cp to /etc/nginx/conf.d/moop-smedgd.conf, chmod 644, restorecon, nginx -t, reload.
# Repo copy: docs/nginx/moop-smedgd.conf -- edit here, then install.
server {
    listen       80;
    listen       [::]:80;
    server_name  smedgd.stowers.org;
    location ~ "^/(?:en/)?ontology/(?<ont_prefix>[A-Z]{2,10})_(?<ont_num>[0-9]{4,8})/?$" {
        return 302 https://planosphere.stowers.org/tools/ontology_term.php?id=$ont_prefix:$ont_num;
    }
    location / {
        return 302 https://planosphere.stowers.org/page.php?p=smedgd;
    }
}
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  smedgd.stowers.org;
    ssl_certificate      "/etc/pki/tls/certs/fullchain.crt";
    ssl_certificate_key  "/etc/pki/tls/private/_stowers.org.key";
    ssl_ciphers          PROFILE=SYSTEM;
    location ~ "^/(?:en/)?ontology/(?<ont_prefix>[A-Z]{2,10})_(?<ont_num>[0-9]{4,8})/?$" {
        return 302 https://planosphere.stowers.org/tools/ontology_term.php?id=$ont_prefix:$ont_num;
    }
    location / {
        return 302 https://planosphere.stowers.org/page.php?p=smedgd;
    }
}
