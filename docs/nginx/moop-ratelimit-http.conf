# MOOP rate limits — HTTP context (zones, request classes, exempt addresses).
# TEMPLATE: scripts/install_nginx_limits.sh replaces the @EXEMPT_RANGES@ line with MOOP's
# auto_login_ip_ranges and installs the result to /etc/nginx/conf.d/moop-ratelimit.conf.
# Re-run that script after changing the IP ranges in Site Configuration. The server-context
# half, and the reasoning for each number, is docs/nginx/moop-ratelimit.conf.

# 1 = never limited: the same addresses MOOP auto-logs-in (internal network, VPN, institute).
geo $moop_rl_exempt {
    ranges;
    default 0;
    @EXEMPT_RANGES@
}

# What kind of request is this? First matching regex wins. Anything that is not PHP is ""
# (static files are never counted).
map $uri $moop_rl_class {
    ~^/moop/api/(moopmart_export|download_zip|download_file|download_annotations|download_search_fasta|blast_download|get_sequence|get_gff|galaxy_mafft_align)\.php$   heavy;
    ~^/moop/tools/(blast|primer_blast|retrieve_sequences|retrieve_selected_sequences|sequences_display)\.php$   heavy;
    ~^/moop/api/jbrowse2/                                                                     jbrowse;
    ~^/moop/api/                                                                              api;
    ~^/moop/tools/(annotation_search_ajax|get_annotation_sources_grouped|get_organism_hierarchy)\.php$   api;
    ~\.php$                                                                                   page;
    default                                                                                   "";
}

# One key per class: the client address when the request is of that class and not exempt,
# otherwise "" (an empty key is not counted).
map "$moop_rl_exempt:$moop_rl_class" $moop_rl_page_key    { "0:page"    $binary_remote_addr; default ""; }
map "$moop_rl_exempt:$moop_rl_class" $moop_rl_api_key     { "0:api"     $binary_remote_addr; default ""; }
map "$moop_rl_exempt:$moop_rl_class" $moop_rl_jbrowse_key { "0:jbrowse" $binary_remote_addr; default ""; }
map "$moop_rl_exempt:$moop_rl_class" $moop_rl_heavy_key   { "0:heavy"   $binary_remote_addr; default ""; }
map "$moop_rl_exempt:$moop_rl_class" $moop_rl_any_key     { ~^0:.+      $binary_remote_addr; default ""; }

limit_req_zone  $moop_rl_page_key    zone=moop_page:10m    rate=2r/s;
limit_req_zone  $moop_rl_api_key     zone=moop_api:10m     rate=10r/s;
limit_req_zone  $moop_rl_jbrowse_key zone=moop_jbrowse:10m rate=30r/s;
limit_req_zone  $moop_rl_heavy_key   zone=moop_heavy:10m   rate=20r/m;
limit_conn_zone $moop_rl_any_key     zone=moop_conn:10m;
limit_conn_zone $moop_rl_heavy_key   zone=moop_heavy_conn:10m;
