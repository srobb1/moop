# MOOP security headers + Content-Security-Policy — SERVER context.
# TEMPLATE: scripts/install_monitor.sh fills @TRACKS_ORIGIN@ from the site config
# (tracks_server.url) and installs the result to /etc/nginx/default.d/moop-headers.conf —
# but ONLY if nginx does not already set these headers somewhere else (a host configured
# before 2026-10-28 has them in nginx.conf; two copies of a header is worse than one).
#
# The CSP is ENFORCED. It still allows 'unsafe-inline' until the ~154 inline event handlers
# are refactored (CLAUDE.md, Known Issues). Every outside host here is there for a reason:
#   challenges.cloudflare.com  Turnstile human check (script + frame)  lib/human_check.php
#   upload.wikimedia.org       organism image when the local copy could not be saved
#   data: in connect-src       JBrowse's worker fetches its WebAssembly decompressor from a
#                              data: URL — without it EVERY JBrowse track fails ("Failed to
#                              fetch"). Found the hard way 2026-10-28; a CSP check must watch
#                              web workers (Chrome DevTools Audits issues), not the page console.
#   @TRACKS_ORIGIN@            the remote JBrowse tracks server, if one is configured
#
# ⚠️ A location with its own add_header drops ALL of these for that location (nginx does not
# merge add_header across levels). moop-security.conf's static-file location uses `expires`
# only, for that reason.

add_header X-Frame-Options        "SAMEORIGIN"                                 always;
add_header X-Content-Type-Options "nosniff"                                    always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"            always;
add_header Permissions-Policy     "geolocation=(), camera=(), microphone=()"   always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://upload.wikimedia.org; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' data: @TRACKS_ORIGIN@; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'self'; form-action 'self'; object-src 'none'; base-uri 'self'" always;
